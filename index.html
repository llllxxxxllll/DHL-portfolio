        const ProgressiveImage = ({ src, alt, className = "", onLoadSuccess, onLoadError, isDarkMode = false }) => {

            const [startDownload, setStartDownload] = useState(false);

        const ScrollReveal = ({ children, delay = 0, className = "" }) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { 
                        setIsVisible(true); 
                        observer.disconnect(); 
                    }
                }, { threshold: 0, rootMargin: "50px" });
                
                if (ref.current) observer.observe(ref.current);
                
                // 安全兜底：防止浏览器初始化时Observer未准确捕获首屏元素导致一直透明
                const timer = setTimeout(() => setIsVisible(true), 800);
                
                return () => { 
                    observer.disconnect(); 
                    clearTimeout(timer);
                };
            }, []);
            
            return ( <div ref={ref} className={`transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] ${isVisible ? "reveal-visible" : "reveal-hidden"} ${className}`} style={{ transitionDelay: `${delay}ms` }}> {children} </div> );
        };

        const SequentialGallery = ({ gallery, isDarkMode = false }) => {
            const [renderCount, setRenderCount] = useState(3); 
            const [failedIndices, setFailedIndices] = useState(new Set());
            const [startDownload, setStartDownload] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => setStartDownload(true), 150);
                return () => clearTimeout(timer);
            }, []);

            const handleSuccess = (idx) => {
                setRenderCount(prev => Math.min(Math.max(prev, idx + 3), gallery.length));
            };

            const handleError = (idx) => {
                setFailedIndices(prev => {
                    const next = new Set(prev);
                    next.add(idx);
                    return next;
                });
                setRenderCount(prev => Math.min(Math.max(prev, idx + 2), gallery.length));
            };

            let cutOffIndex = gallery.length;
            let consecutiveFails = 0;
            
            for (let i = 0; i < renderCount; i++) {
                if (failedIndices.has(i)) {
                    consecutiveFails++;
                    if (consecutiveFails >= 3) {
                        cutOffIndex = i - 2; 
                        break;
                    }
                } else {
                    consecutiveFails = 0;
                }
            }

            const itemsToRender = gallery.slice(0, Math.min(renderCount, cutOffIndex));

            return (
                <div className="flex flex-col gap-4 px-6 md:gap-[26px] md:px-20 mb-16">

                        return (

                return project ? { ...project, detailTitle: item.title } : null;
            }).filter(Boolean), [allProjects]);

            const prevProject = useMemo(() => {
                if (!activeProject) return null;
                const idx = detailProjectSequence.findIndex(p => p.id === activeProject.id);
                return idx > 0 ? detailProjectSequence[idx - 1] : null;
            }, [activeProject, detailProjectSequence]);

            const nextProject = useMemo(() => {
                if (!activeProject) return null;
                const idx = detailProjectSequence.findIndex(p => p.id === activeProject.id);
                return idx >= 0 ? (detailProjectSequence[idx + 1] || null) : null;
            }, [activeProject, detailProjectSequence]);

            useEffect(() => {
                if (activeProject) return;
                let ticking = false;
                const handler = () => {
                    if (ticking) return;
                    ticking = true;
                    window.requestAnimationFrame(() => {
                        const y = window.scrollY;
                        setNavScrolled(y > 18);
                        const sections = ['projects', 'leadership', 'experience', 'contact'];
                        const marker = y + 150;
                        let current = 'projects';
                        sections.forEach((id) => {
                            const el = document.getElementById(id);
                            if (el && el.offsetTop <= marker) current = id;
                        });
                        if (window.innerHeight + y >= document.documentElement.scrollHeight - 100) current = 'contact';
                        setActiveSection(current);
                        ticking = false;
                    });
                };
                handler();
                window.addEventListener('scroll', handler, { passive: true });
                window.addEventListener('resize', handler);
                return () => {
                    window.removeEventListener('scroll', handler);
                    window.removeEventListener('resize', handler);
                };
            }, [activeProject]);

            const scrollToSection = (id) => {
                setActiveSection(id);
                const el = document.getElementById(id);
                if (id === 'bio') { window.scrollTo({ top: 0, behavior: 'smooth' }); }
                else if (el) { window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' }); }
            };

            const handleCopy = (txt) => {
                const textArea = document.createElement("textarea");
                textArea.value = txt;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "0";
                document.body.appendChild(textArea);
                textArea.focus(); textArea.select();
                try { document.execCommand('copy'); setToast("复制成功"); } catch (err) { setToast("复制失败"); }
                document.body.removeChild(textArea);
                setTimeout(() => setToast(""), 2000);
            };

            const projectUrlFor = (id) => {

                    style={{ filter: light ? 'brightness(0) invert(1)' : 'brightness(0)' }}
                />
            );

            // Restore the original animated homepage cover treatment for the two AI projects only.
            const LegacyAIHomepageCover = ({ projectId, title }) => {
                const isABMAI = projectId === 3;
                const folder = isABMAI ? 'abm-ai' : 'vtn-ai';
                const initialId = `home-legacy-cover0-${projectId}`;
                return (
                    <div className="fig-cover-img legacy-ai-cover">
                        <img
                            src={`${COS_URL}/projects/${folder}/cover.jpg?v=${AI_COVER_VERSION}`}
                            alt={`${title} Background`}
                            className="legacy-ai-cover-bg"
                            loading="eager"
                            decoding="async"
                            referrerPolicy="no-referrer"
                        />
                        <div
                            className="legacy-ai-cover-video-wrap"
                            style={{ left: isABMAI ? 'calc(55% + 20px)' : 'calc(50% + 40px)' }}
                        >
                            <video
                                src={`${COS_URL}/projects/${folder}/cover.mp4?v=${AI_COVER_VERSION}`}
                                autoPlay
                                loop
                                muted
                                playsInline
                                preload="metadata"
                                className={`legacy-ai-cover-video ${isABMAI ? 'abm-ai' : ''}`}
                                onCanPlay={() => {
                                    const cover0 = document.getElementById(initialId);
                                    if (cover0) {
                                        cover0.style.opacity = '0';
                                        window.setTimeout(() => {
                                            cover0.style.display = 'none';
                                        }, 1500);
                                    }
                                }}
                            />
                        </div>
                        <img
                            src={`${COS_URL}/projects/${folder}/cover.png?v=${AI_COVER_VERSION}`}
                            alt=""
                            className="legacy-ai-cover-fg"
                            loading="eager"
                            decoding="async"
                            referrerPolicy="no-referrer"
                        />
                        <div className="legacy-ai-cover-shade"></div>
                        <img
                            id={initialId}
                            src={`${COS_URL}/projects/${folder}/cover0.jpg?v=${AI_COVER_VERSION}`}
                            alt={`${title} Initial Cover`}
                            className="legacy-ai-cover-initial"
                            loading="eager"
                            decoding="async"
                            referrerPolicy="no-referrer"
                        />
                    </div>
                );
            };

            const renderProjectGroup = (group) => (
                <section key={group.groupId} className="mb-24">
                    {group.groupTitle && (
                        <ScrollReveal className="relative z-20">
                            <div className="mb-[18px] md:mb-8 pl-1">
                                <h2 className="text-[26px] md:text-[44px] font-thin text-black/50">{group.groupTitle}</h2>
                            </div>
                        </ScrollReveal>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        {group.projects.map((p, i) => {
                            const isDoubleLayerCover = !!p.coverVideoBackground;
                            const isGifForeground = !!p.coverForegroundGif;
                            const isTripleLayerCover = !!p.coverVideoCenter;

                            return (
                                <ScrollReveal key={p.id} delay={i * 100} className={p.fullWidth ? "md:col-span-2" : ""}>
                                    <div className="group cursor-pointer transition-all duration-700 md:hover:-translate-y-2 relative w-full" 
                                         onClick={() => { 
                                             if (p.externalLink) {
                                                 window.open(p.externalLink, '_blank');
                                             } else {
                                                 scrollPosRef.current = window.scrollY; 
                                                 setActiveProject(p); 
                                                 window.scrollTo(0,0); 
                                             }
                                        }}>
                                        
                                        <div className="aspect-video overflow-hidden bg-[#ededed] relative">
                                            {isGifForeground ? (
                                                <div className="w-full h-full relative transition-transform duration-1000 md:group-hover:scale-105">
                                                    <img src={freshAssetUrl(p.cover)} alt={`${p.title} Background`} className="absolute inset-0 w-full h-full object-cover z-0" loading="lazy" decoding="async" />
                                                    <img src={freshAssetUrl(p.coverForegroundGif)} alt={`${p.title} Foreground GIF`} className="absolute left-[5%] top-1/2 -translate-y-1/2 h-[62.3%] w-auto object-contain z-10 pointer-events-none" loading="lazy" decoding="async" />
                                                </div>
                                            ) : isTripleLayerCover ? (
                                                <div className="w-full h-full relative transition-transform duration-1000 md:group-hover:scale-105">
                                                    {p.cover0 && (
                                                        <img 
                                                            id={`cover0-img-${p.id}`}
                                                            src={freshAssetUrl(p.cover0)} 
                                                            alt={`${p.title} Initial Cover`} 
                                                            className="absolute inset-0 w-full h-full object-cover z-30 transition-opacity duration-[1.5s] ease-in-out pointer-events-none" 
                                                            loading="lazy" decoding="async"
                                                        />
                                                    )}

                                                    <img src={freshAssetUrl(p.cover)} alt={`${p.title} Background`} className="absolute inset-0 w-full h-full object-cover z-0" loading="lazy" decoding="async" />
                                                    
                                                    <div className="absolute bottom-0 -translate-x-1/2 h-[90%] z-10 flex pointer-events-none" style={{ left: p.coverVideoLeftOffset || '50%' }}>
                                                        <video 
                                                            src={freshAssetUrl(p.coverVideoCenter)} 
                                                            autoPlay loop muted playsInline preload="metadata"
                                                            webkit-playsinline="true" x5-playsinline="true"
                                                            className={`h-full w-auto block object-contain object-bottom ${p.coverVideoScale || 'scale-[0.94]'} origin-bottom`}
                                                            onCanPlay={(e) => {
                                                                const cover0 = document.getElementById(`cover0-img-${p.id}`);
                                                                if (cover0) {
                                                                    cover0.style.opacity = '0';
                                                                    setTimeout(() => { cover0.style.display = 'none'; }, 1500);
                                                                }
                                                            }}
                                                        ></video>
                                                    </div>

                                                    {p.coverForegroundPng && (
                                                        <img src={freshAssetUrl(p.coverForegroundPng)} alt={`${p.title} Foreground`} className="absolute inset-0 w-full h-full object-cover z-20 pointer-events-none" loading="lazy" decoding="async" />
                                                    )}

                                                    <div className="absolute inset-0 bg-[#000000] opacity-[0.04] z-[25] pointer-events-none"></div>
                                                </div>
                                            ) : isDoubleLayerCover ? (
                                                <div className="w-full h-full relative transition-transform duration-1000 md:group-hover:scale-105">
                                                    <video 
                                                        src={freshAssetUrl(p.coverVideoBackground)} 
                                                        poster={freshAssetUrl(p.coverVideoPoster) || undefined}
                                                        autoPlay loop muted playsInline preload="metadata"
                                                        webkit-playsinline="true" x5-playsinline="true"
                                                        className="absolute inset-0 w-full h-full object-cover z-0"
                                                    ></video>
                                                    {p.coverForeground && (
                                                        <img 
                                                            src={freshAssetUrl(p.coverForeground)} 
                                                            alt={`${p.title} Foreground`}
                                                            className="absolute inset-0 w-full h-full object-cover z-10 pointer-events-none"
                                                            loading="lazy" decoding="async"
                                                        />
                                                    )}
                                                </div>
                                            ) : (
                                                <ProgressiveImage src={freshAssetUrl(p.cover)} alt={p.title} className="w-full h-full md:group-hover:scale-105 transition-transform duration-1000" />
                                            )}
                                        </div>
                                    </div>
                                </ScrollReveal>
                            );
                        })}
                    </div>
                </section>
            );

            if (activeProject) {
                const isDarkMode = activeProject.id === 6;

                return (
                    <div className={`${isDarkMode ? 'bg-[#222222] text-white' : 'bg-[#ffffff] text-black'} min-h-screen fade-in`}>
                        <header className={`sticky top-0 z-50 ${isDarkMode ? 'bg-[#222222]/90 border-white/[0.05]' : 'bg-[#ffffff]/90 border-black/[0.05]'} backdrop-blur-md py-6 px-6 md:px-20 border-b`}>
                            <div className="max-w-[90rem] mx-auto flex items-center justify-between">
                                <button onClick={returnToPortfolio} 
                                        className="group flex items-center gap-3 text-sm font-light uppercase tracking-widest hover:opacity-60 transition-opacity">
                                    <span className={`w-8 h-8 rounded-full border ${isDarkMode ? 'border-white/20 group-hover:border-white' : 'border-black/20 group-hover:border-black'} flex items-center justify-center transition-colors`}><ArrowLeftIcon size={16} /></span> 返回作品集列表
                                </button>
                            </div>
                        </header>
                        <main className={`max-w-[90rem] mx-auto pt-0 md:pt-20 ${isDarkMode ? 'bg-[#222222]' : 'bg-[#ffffff]'}`}>
                            
                            <SequentialGallery key={activeProject.id} gallery={activeProject.gallery} isDarkMode={isDarkMode} />

                            <div className="pt-12 pb-24 md:pb-40 flex flex-row justify-center items-stretch gap-3 md:gap-6 px-4 md:px-6 max-w-5xl mx-auto">
                                {prevProject && (
                                    <button onClick={() => showProjectInCurrentTab(prevProject)} 
                                            className={`group flex-1 flex flex-col items-center justify-center gap-2 md:gap-6 px-2 md:px-16 py-8 md:py-20 transition-all duration-700 text-center w-full bg-transparent border border-transparent hover:-translate-y-3 ${isDarkMode ? 'hover:bg-[#333333] hover:border-white/10 hover:shadow-[0_50px_100px_rgba(255,255,255,0.03)]' : 'hover:bg-white hover:border-black/5 hover:shadow-[0_50px_100px_rgba(0,0,0,0.06)]'}`}>
                                        <span className={`${isDarkMode ? 'text-white/50' : 'text-black/50'} text-sm md:text-sm tracking-widest md:tracking-[0.5em] uppercase font-light`}>上一个作品</span>
                                        <div className="text-xl md:text-2xl lg:text-3xl font-light tracking-tight transition-all underline md:no-underline md:group-hover:underline underline-offset-8 decoration-1 flex items-center justify-center leading-tight">
                                            {prevProject.detailTitle || prevProject.title}
                                        </div>
                                    </button>
                                )}
                                {nextProject ? (
                                    <button onClick={() => showProjectInCurrentTab(nextProject)} 
                                            className={`group flex-1 flex flex-col items-center justify-center gap-2 md:gap-6 px-2 md:px-16 py-8 md:py-20 transition-all duration-700 text-center w-full bg-transparent border border-transparent hover:-translate-y-3 ${isDarkMode ? 'hover:bg-[#333333] hover:border-white/10 hover:shadow-[0_50px_100px_rgba(255,255,255,0.03)]' : 'hover:bg-white hover:border-black/5 hover:shadow-[0_50px_100px_rgba(0,0,0,0.06)]'}`}>
                                        <span className={`${isDarkMode ? 'text-white/50' : 'text-black/50'} text-sm md:text-sm tracking-widest md:tracking-[0.5em] uppercase font-light`}>下一个作品</span>
                                        <div className="text-xl md:text-2xl lg:text-3xl font-light tracking-tight transition-all underline md:no-underline md:group-hover:underline underline-offset-8 decoration-1 flex items-center justify-center leading-tight">
                                            {nextProject.detailTitle || nextProject.title}
                                        </div>
                                    </button>
                                ) : (
                                    <button onClick={returnToPortfolio} 
                                            className={`group flex-1 flex flex-col items-center justify-center gap-2 md:gap-6 px-2 md:px-16 py-8 md:py-20 transition-all duration-700 text-center w-full bg-transparent border border-transparent hover:-translate-y-3 ${isDarkMode ? 'hover:bg-[#333333] hover:border-white/10 hover:shadow-[0_50px_100px_rgba(255,255,255,0.03)]' : 'hover:bg-white hover:border-black/5 hover:shadow-[0_50px_100px_rgba(0,0,0,0.06)]'}`}>
                                        <span className={`${isDarkMode ? 'text-white/50' : 'text-black/50'} text-sm md:text-sm tracking-widest md:tracking-[0.5em] uppercase font-light`}>End</span>
                                        <div className="text-xl md:text-2xl lg:text-3xl font-light tracking-tight transition-all underline md:no-underline md:group-hover:underline underline-offset-8 decoration-1 uppercase leading-tight">返回作品集列表</div>
                                    </button>
                                )}
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-white text-[#111] fade-in">
                    {toast && <div className="fixed top-8 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full text-xs z-[1000] fade-in shadow-2xl">{toast}</div>}

                    {/* NAV — exact Figma geometry */}
                    <nav className={`fig-nav ${navScrolled ? 'scrolled' : ''}`}>
                        <div className="fig-nav-inner fig-pf">
                            <button onClick={() => scrollToSection('bio')} className="fig-button-reset fig-logo">
                                <span className="block">DING</span><span className="block">HELIANG</span>
                            </button>
                            <div className="fig-nav-links">
                                <button onClick={() => scrollToSection('projects')} className={`fig-button-reset fig-nav-link ${activeSection === 'projects' ? 'active' : ''}`}>精选项目</button>
                                <button onClick={() => scrollToSection('leadership')} className={`fig-button-reset fig-nav-link ${activeSection === 'leadership' ? 'active' : ''}`}>设计领导力</button>
                                <button onClick={() => scrollToSection('experience')} className={`fig-button-reset fig-nav-link ${activeSection === 'experience' ? 'active' : ''}`}>工作经历</button>
                                <button onClick={() => scrollToSection('contact')} className={`fig-button-reset fig-nav-link ${activeSection === 'contact' ? 'active' : ''}`}>联系我</button>
                            </div>
                        </div>
                    </nav>

                    <div className="fig-home fig-pf">
                        {/* HERO — 1920 × 1195 */}
                        <header id="bio" className="fig-hero">
                            <HomeImage src={`${HOME_ASSETS}/hero-bg.png`} alt="" priority className="fig-hero-bg" />
                            <div className="fig-hero-content">
                                <div className="fig-hero-name">丁贺亮</div>
                                <div className="fig-hero-title">产品体验设计 · 设计领导力</div>
                                <div className="fig-hero-exp">15+年体验设计&nbsp;&nbsp;|&nbsp;&nbsp;6+年团队管理&nbsp;&nbsp;|&nbsp;&nbsp;厦门大学&nbsp;&nbsp;|&nbsp;&nbsp;数字媒体艺术专业</div>
                                <div className="fig-hero-tags">
                                    {[
                                        ['C端电商',113],['复杂b端',112],['AI产品',104],['商业增长',117],['全球化',104]
                                    ].map(([t,w]) => <span key={t} className="fig-hero-tag" style={{width:`${w}px`}}>{t}</span>)}
                                </div>
                                <div className="fig-hero-scroll-label">向下查看作品集</div>
                                <HomeImage src={`${HOME_ASSETS}/hero-scroll-arrow.svg`} alt="" priority className="fig-hero-arrow" />
                            </div>
                        </header>

                        {/* SELECTED WORK */}
                        <section id="projects" className="fig-projects">
                            <div className="fig-shell">
                                <h2 className="fig-section-title fig-projects-title">精选项目</h2>

                                <button onClick={() => openProjectById(1)} className="fig-button-reset fig-main-card">
                                    <HomeImage src={`${HOME_ASSETS}/vtn-visual.png`} alt="" className="fig-cover-img" />
                                    <div className="fig-main-content">
                                        <div className="fig-vtn-head">
                                            <HomeImage src={`${HOME_ASSETS}/vtn-app-icon.png`} alt="VTN" className="fig-vtn-icon" />
                                            <div className="fig-vtn-title">VTN</div>
                                            <div className="fig-vtn-platform">ACCESS核心电商平台</div>
                                        </div>
                                        <div className="fig-vtn-headline">品牌与体验升级</div>
                                        <div className="fig-vtn-role">设计统筹/项目主设</div>
                                        <span className="fig-vtn-rule"></span>
                                        <p className="fig-vtn-desc">将“源健康”业务战略与“主流之前”品牌价值转化为产品体验，从品牌设计语言、核心用户旅程到设计体系完成全链路升级。</p>
                                        <div className="fig-metrics fig-inter">
                                            {featuredProjects[0].metrics.map(([v,l]) => (
                                                <div key={l} className="fig-metric">
                                                    <p className="fig-metric-value">{v}</p>
                                                    <p className="fig-metric-label">{l}</p>
                                                </div>
                                            ))}
                                        </div>
                                        <span className="fig-main-btn">
                                            <span className="fig-main-btn-label">查看详情</span>
                                            <img src={`${HOME_ASSETS}/btn-arrow.svg`} alt="" className="fig-main-btn-arrow" />
                                        </span>
                                    </div>
                                </button>

                                <div className="fig-support-grid">
                                    {featuredProjects.filter(p => !p.featured).map((p) => (
                                        <button key={p.id} onClick={() => openProjectById(p.id)} className="fig-button-reset fig-support-card">
                                            {(p.id === 4 || p.id === 3)
                                                ? <LegacyAIHomepageCover projectId={p.id} title={p.title} />
                                                : <HomeImage src={p.visual} alt="" className="fig-cover-img" />
                                            }
                                            <div className="fig-support-content">
                                                <h3 className="fig-support-title">{p.title}</h3>
                                                <p className="fig-support-sub">{p.subtitle}</p>
                                                <div className={`fig-support-tags ${p.id === 7 ? 'wrap' : ''}`}>
                                                    {p.tags.map((t) => <span key={t} className="fig-support-tag">{t}</span>)}
                                                </div>
                                            </div>
                                            <span className="fig-support-btn">
                                                <span className="fig-support-btn-label">查看详情</span>
                                                <img src={`${HOME_ASSETS}/btn-arrow.svg`} alt="" className="fig-support-btn-arrow" />
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </section>

                        <div className="fig-gap-168"></div>

                        {/* LEADERSHIP */}
                        <section id="leadership">
                            <div className="fig-shell">
                                <h2 className="fig-section-title fig-lead-title">团队管理</h2>
                                <button onClick={() => openProjectById(9)} className="fig-button-reset fig-lead-card">
                                    <div className="fig-lead-ambient" aria-hidden="true">
                                        <HomeImage src={`${HOME_ASSETS}/leadership-team.png`} alt="" className="fig-cover-img" />
                                    </div>
                                    <div className="fig-lead-content">
                                        <h3 className="fig-lead-h3">设计领导力</h3>
                                        <p className="fig-lead-body">从设计交付团队到业务共创伙伴，将个人能力逐步沉淀为可持续的组织能力。</p>
                                        <div className="fig-lead-tags">
                                            {['人才文化建设','协作机制','设计资产','业务影响'].map(t => <span key={t} className="fig-lead-tag">{t}</span>)}
                                        </div>
                                        <div className="fig-lead-metrics fig-inter">
                                            <span className="fig-lead-sep s1"></span><span className="fig-lead-sep s2"></span>
                                            {[
                                                ['i1','11','人','设计团队规模'],['i2','3','条','核心业务线'],['i3','5','大','设计语言体系']
                                            ].map(([cls,n,u,l]) => (
                                                <div key={l} className={`fig-lead-item ${cls}`}>
                                                    <div className="fig-lead-numline"><span className="fig-lead-num">{n}</span><span className="fig-lead-unit">{u}</span></div>
                                                    <p className="fig-lead-label fig-pf">{l}</p>
                                                </div>
                                            ))}
                                        </div>
                                        <span className="fig-lead-btn">
                                            <span className="fig-lead-btn-label">查看详情</span>
                                            <img src={`${HOME_ASSETS}/btn-arrow.svg`} alt="" className="fig-lead-btn-arrow" />
                                        </span>
                                    </div>
                                </button>
                            </div>
                        </section>

                        <div className="fig-gap-168"></div>

                        {/* EXPERIENCE */}
                        <section id="experience">
                            <div className="fig-shell">
                                <h2 className="fig-section-title fig-exp-title">工作经历</h2>
                                <div className="fig-exp-card">
                                    <div className="fig-exp-row">
                                        {homeExperienceData.map((exp, idx) => (
                                            <div key={exp.company} className="fig-exp-item">
                                                <p className="fig-exp-time">{exp.time}</p>
                                                <span className="fig-exp-dot"></span>
                                                <span className="fig-exp-line"></span>
                                                <p className="fig-exp-company">{exp.company}</p>
                                                <p className="fig-exp-role">{exp.role}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div className="fig-gap-168"></div>

                        {/* CONTACT */}
                        <footer id="contact" className="fig-contact">
                            {/* Figma v4: contact is a solid black section; no background image */}
                            <div className="fig-contact-group">
                                <h2 className="fig-contact-title">联系我</h2>
                                <p className="fig-contact-sub">欢迎就产品体验、设计管理与合作机会与我交流</p>
                                <div className="fig-contact-email">
                                    <p className="fig-contact-label">邮箱</p>
                                    <button onClick={() => handleCopy(personalInfo.email)} className="fig-button-reset fig-contact-value">{personalInfo.email}</button>
                                </div>
                                <div className="fig-contact-phone">
                                    <p className="fig-contact-label">电话</p>
                                    <button onClick={() => handleCopy(personalInfo.phone)} className="fig-button-reset fig-contact-value">{personalInfo.phone}</button>
                                </div>
                                <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})} className="fig-button-reset fig-contact-back">
                                    <span className="fig-contact-back-label">返回顶部</span><svg className="fig-contact-up" viewBox="0 0 14 20" aria-hidden="true"><path d="M7 19V3.5M2.5 8L7 3.5 11.5 8" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="square" strokeLinejoin="miter" /></svg>
                                </button>
                            </div>
                            <div className="fig-footer-brand">
                                <span className="fig-footer-line left"></span>
                                <span className="fig-footer-name">DING HELIANG</span>
                                <span className="fig-footer-line right"></span>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        }
        
        const startApp = () => {
            const rootElement = document.getElementById('root');
            if (window.ReactDOM && rootElement) {
                const root = window.ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        };
        startApp();
    </script>
</body>
</html>
